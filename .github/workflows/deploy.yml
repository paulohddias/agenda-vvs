name: Deploy para a HostGator

# Roda sempre que algo entra na branch main. Sem acesso SSH no servidor,
# então: builda o projeto, compacta tudo num zip só, sobe esse zip por FTP
# (um arquivo, rápido — evita mandar milhares de arquivos do vendor um por um)
# e chama um script (deploy-hook.php) que já está no servidor pra descompactar.
# Migrations novas do banco ainda precisam ser rodadas manualmente (cron job).
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Instalar dependências do PHP (sem as de desenvolvimento)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-interaction

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Instalar dependências do front e gerar os arquivos (CSS/JS)
        run: |
          npm ci
          npm run build

      - name: Compactar tudo num zip só
        run: |
          zip -r -q ../_deploy.zip . \
            -x '.git/*' '.git/**' '.github/*' '.github/**' \
            -x 'node_modules/*' 'node_modules/**' \
            -x 'tests/*' 'tests/**' \
            -x '.env' '.env.*' \
            -x '*.md' \
            -x 'phpunit.xml' 'package*.json' 'vite.config.js' 'postcss.config.js' 'tailwind.config.js' \
            -x '.editorconfig' '.gitattributes' '.npmrc' \
            -x 'storage/logs/*' 'storage/logs/**' \
            -x 'storage/framework/*' 'storage/framework/**' \
            -x 'storage/app/private/appointment-documents/*' 'storage/app/private/appointment-documents/**' \
            -x 'bootstrap/cache/*' 'bootstrap/cache/**' \
            -x 'public/deploy-hook.php'
          mv ../_deploy.zip ./_deploy.zip
          ls -lh _deploy.zip

      - name: Enviar o zip por FTP (um arquivo só)
        run: |
          curl --ftp-create-dirs -T _deploy.zip \
            "ftp://${{ secrets.FTP_HOST }}/agenda/_deploy.zip" \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            --connect-timeout 30 --max-time 300

      - name: Pedir para o servidor extrair o zip
        run: |
          response=$(curl -s -w '\n%{http_code}' -X POST "https://agenda.viavalesistemas.com.br/deploy-hook.php" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_TOKEN }}")
          status=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Status HTTP: $status"
          echo "Resposta do servidor: $body"
          if [ "$status" != "200" ]; then
            echo "::error::deploy-hook.php respondeu $status"
            exit 1
          fi
